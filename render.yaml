services:
  - type: web
    name: compilncemg
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python db_setup.py
    startCommand: gunicorn app:app
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
