<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Secure Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <h1>CMS Portal</h1>
            </div>
            
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Please enter your credentials to access the Complaint Management System.</p>
            </div>

            <div id="alert-box" class="alert" style="display: none;"></div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="input-control" 
                        autocomplete="username" 
                        required 
                        minlength="3" 
                        placeholder="Enter username"
                        enterkeyhint="next"
                    >
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="password">Password</label>
                    </div>
                    <div style="position: relative;">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="input-control" 
                            autocomplete="current-password" 
                            required 
                            placeholder="Enter password"
                            enterkeyhint="done"
                            style="padding-right: 3rem;"
                        >
                        <button 
                            type="button" 
                            id="toggle-password" 
                            style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; color: var(--text-secondary);"
                            aria-label="Toggle Password Visibility"
                        >
                            <!-- Eye icon -->
                            <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary" style="margin-top: 1rem;">
                    Secure Sign In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </div>

    <script>
        // Check if token already exists, redirect to dashboard
        if (localStorage.getItem('cms_jwt_token')) {
            window.location.href = 'dashboard.html';
        }

        const loginForm = document.getElementById('login-form');
        const alertBox = document.getElementById('alert-box');
        const submitBtn = document.getElementById('submit-btn');
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        // Toggle password visibility
        togglePasswordBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
            }
        });

        // Form Submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            // Client Validation check
            if (!loginForm.checkValidity()) {
                showAlert('Please fill in all required fields correctly.', 'error');
                return;
            }

            // Disable button during loading
            submitBtn.disabled = true;
            submitBtn.innerText = 'Verifying...';

            const username = document.getElementById('username').value;
            const password = passwordInput.value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();

                if (response.ok) {
                    showAlert('Success! Redirecting...', 'success');
                    // Store token & user metadata in localStorage
                    localStorage.setItem('cms_jwt_token', data.token);
                    localStorage.setItem('cms_user_data', JSON.stringify(data.user));
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 800);
                } else {
                    showAlert(data.message || 'Verification failed. Try again.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Secure Sign In';
                }
            } catch (error) {
                showAlert('Unable to contact the server. Please check connection.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Secure Sign In';
            }
        });

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';
        }
    </script>
</body>
</html>
